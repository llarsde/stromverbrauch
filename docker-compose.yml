services:
  stromverbrauch:
    image: ghcr.io/llarsde/stromverbrauch:latest
    container_name: stromverbrauch
    restart: unless-stopped
    ports:
      - "8088:8080"          # links: Port auf dem OMV
    environment:
      - TZ=Europe/Berlin
    volumes:
      # Datenbank und Fotos – diesen Ordner ins Backup aufnehmen
      - /srv/dev-disk-by-uuid-XXXX/appdata/stromverbrauch:/data
